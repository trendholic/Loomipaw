# =====================================================================
# Loomipaw — nginx reverse proxy (TLS termination + gzip + caching)
# Place at /etc/nginx/conf.d/loomipaw.conf (or mount into the compose proxy).
# Replace loomipaw.com and the cert paths with your own.
# =====================================================================

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name loomipaw.com www.loomipaw.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name loomipaw.com www.loomipaw.com;

    # --- TLS (use certbot / your CA) ---
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # --- Hardening (HSTS is also set by the app in production) ---
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;        # allow product image uploads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Long-cache immutable, content-addressed uploads.
    location /uploads/ {
        proxy_pass http://app:4000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else → the Node app.
    location / {
        proxy_pass http://app:4000;          # or http://127.0.0.1:4000 without compose
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
