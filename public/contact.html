<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Contact — Loomipaw</title>
  <meta name="description" content="Get in touch with the Loomipaw team." />
  <meta name="theme-color" content="#FAF6EF" />
  <meta name="robots" content="index,follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B1915'/%3E%3Cg fill='%23C6A15B'%3E%3Cellipse cx='11' cy='12' rx='2.1' ry='2.7'/%3E%3Cellipse cx='21' cy='12' rx='2.1' ry='2.7'/%3E%3Cellipse cx='7' cy='17' rx='1.9' ry='2.4'/%3E%3Cellipse cx='25' cy='17' rx='1.9' ry='2.4'/%3E%3Cpath d='M16 16c3.4 0 6 2.7 6 5.4 0 2-1.7 3.1-3.6 3.1-1 0-1.7-.4-2.4-.4s-1.4.4-2.4.4c-1.9 0-3.6-1.1-3.6-3.1 0-2.7 2.6-5.4 6-5.4z'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-partial="header"></div>
  <main id="main">
    <section class="page"><div class="container wide-narrow">
      <div class="page__head"><p class="eyebrow">We’d love to hear from you</p><h1>Contact us</h1><p>Questions about sizing, orders or anything else? Send us a note and we’ll reply within one business day.</p></div>
      <form class="auth-card" data-contact-form>
        <div data-contact-alert></div>
        <div class="field--row"><div class="field"><label for="c-name">Name</label><input id="c-name" name="name" required></div><div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" required></div></div>
        <div class="field"><label for="c-subject">Subject</label><input id="c-subject" name="subject"></div>
        <div class="field"><label for="c-message">Message</label><textarea id="c-message" name="message" required></textarea></div>
        <button class="btn btn--block" type="submit">Send message</button>
      </form>
    </div></section>
  </main>
  <div data-partial="footer"></div>
  <div data-partial="cart"></div>
  <script src="assets/js/api.js" defer></script>
  <script src="assets/js/partials.js" defer></script>
  <script src="assets/js/main.js" defer></script>
  <script src=assets/js/contact.js defer></script>
</body>
</html>
